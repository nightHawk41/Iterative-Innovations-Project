<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UMBC Vending Inventory System</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --gold: #f0a500;
        --black: #1a1a1a;
        --panel-bg: #e8e8e8;
        --sidebar-bg: #d4d4d4;
        --border: #999;
        --green: #4caf50;
        --yellow: #f5c518;
        --red: #e53935;
        --slot-border: #444;
        --header-bg: #c8c8c8;
        --blue-panel: #cfe2f3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'IBM Plex Sans', sans-serif;
        background: #b0b0b0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ── HEADER ── */
    header {
        display: flex;
        align-items: center;
        background: var(--panel-bg);
        border-bottom: 2px solid var(--border);
        padding: 10px 20px;
        gap: 20px;
    }

    .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
        border-right: 2px solid var(--border);
        padding-right: 20px;
    }

    .umbc-shield { width: 52px; height: 52px; }

    .umbc-text {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -1px;
        color: var(--black);
    }

    .header-title {
        font-size: 1.2rem;
        color: #333;
        padding-left: 12px;
    }

    /* ── MAIN LAYOUT ── */
    .app-body {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 0;
        flex: 1;
        min-height: 0;
    }

    /* ── SIDEBAR ── */
    .sidebar {
        background: var(--sidebar-bg);
        border-right: 2px solid var(--border);
        padding: 0;
        display: flex;
        flex-direction: column;
    }

    .nav-tabs {
        display: flex;
        border-bottom: 2px solid var(--border);
    }

    .nav-tab {
        flex: 1;
        padding: 8px 10px;
        font-size: 0.82rem;
        font-weight: 600;
        border: none;
        background: var(--header-bg);
        cursor: pointer;
        border-right: 1px solid var(--border);
        transition: background 0.15s;
    }

    .nav-tab:last-child { border-right: none; }
    .nav-tab.active { background: var(--panel-bg); }
    .nav-tab:hover { background: #d8d8d8; }

    .sidebar-content {
        padding: 12px;
        flex: 1;
        overflow-y: auto;
    }

    .panel-box {
        border: 2px solid var(--border);
        background: var(--panel-bg);
        margin-bottom: 10px;
    }

    .panel-box-header {
        background: var(--header-bg);
        border-bottom: 1px solid var(--border);
        padding: 6px 10px;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
    }

    .panel-box-header .toggle-btn {
        font-size: 0.75rem;
        color: #555;
    }

    .panel-box-body {
        padding: 10px;
        background: var(--blue-panel);
        display: none;
    }

    .panel-box-body.open { display: block; }

    .form-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 0.8rem;
    }

    .form-row label {
        min-width: 80px;
        font-weight: 600;
        font-size: 0.78rem;
        color: #333;
    }

    .form-row select,
    .form-row input {
        flex: 1;
        padding: 4px 6px;
        border: 1px solid var(--border);
        font-size: 0.78rem;
        font-family: 'IBM Plex Sans', sans-serif;
        background: white;
    }

    .btn-row {
        display: flex;
        gap: 6px;
        margin-top: 4px;
    }

    .btn {
        padding: 5px 14px;
        border: 1.5px solid var(--border);
        background: var(--panel-bg);
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
    }

    .btn:hover { background: #ccc; }
    .btn.primary { background: var(--black); color: white; border-color: var(--black); }
    .btn.primary:hover { background: #333; }

    .sidebar-action-btn {
        width: 100%;
        text-align: left;
        padding: 7px 10px;
        border: 2px solid var(--border);
        background: var(--panel-bg);
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 0.83rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s;
    }

    .sidebar-action-btn:hover { background: #d0d0d0; }

    .sidebar-footer {
        padding: 10px 12px;
        border-top: 2px solid var(--border);
        display: flex;
        gap: 8px;
    }

    /* ── FIELD ERRORS ── */
    .field-error {
        color: var(--red);
        font-size: 0.72rem;
        margin-top: -4px;
        margin-bottom: 6px;
        display: none;
    }
    .field-error.visible { display: block; }

    /* ── CSV FEEDBACK ── */
    .csv-feedback {
        font-size: 0.75rem;
        margin-top: 6px;
        margin-bottom: 6px;
        padding: 5px 8px;
        border-left: 3px solid var(--border);
        background: white;
        display: none;
    }
    .csv-feedback.visible  { display: block; }
    .csv-feedback.success  { border-color: var(--green); color: #2a6e2a; }
    .csv-feedback.error    { border-color: var(--red);   color: #a01a1a; }

    /* ── STAT CARDS ── */
    .stat-card {
        border: 2px solid var(--border);
        background: white;
        padding: 10px 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.9rem;
        font-weight: 500;
    }

    .stat-card .stat-value {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .stat-card.healthy .stat-value { color: var(--green); }
    .stat-card.warning .stat-value { color: #c8880a; }
    .stat-card.critical .stat-value { color: var(--red); }

    /* ── RIGHT PANEL: MACHINE ── */
    .machine-panel {
        background: var(--panel-bg);
        display: flex;
        flex-direction: column;
    }

    .machine-panel-header {
        background: var(--header-bg);
        border-bottom: 2px solid var(--border);
        padding: 8px 14px;
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
    }

    .machine-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 14px;
        flex: 1;
    }

    .slot {
        border: 2px solid var(--slot-border);
        padding: 8px 6px;
        cursor: pointer;
        text-align: center;
        transition: filter 0.15s, transform 0.1s;
        font-size: 0.72rem;
        position: relative;
    }

    .slot:hover:not(.disabled) {
        filter: brightness(0.9);
        transform: scale(1.03);
    }

    .slot.disabled {
        background: #aaa !important;
        cursor: not-allowed;
        opacity: 0.7;
    }

    .slot.green  { background: #5db85d; color: #fff; }
    .slot.yellow { background: var(--yellow); color: #333; }
    .slot.red    { background: var(--red); color: #fff; }

    .slot-id {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 2px;
    }

    .slot-name  { font-size: 0.68rem; margin-bottom: 2px; }
    .slot-price { font-weight: 600; font-size: 0.75rem; }
    .slot-stock { font-size: 0.65rem; opacity: 0.9; }
    .slot-exp   { font-size: 0.6rem; opacity: 0.8; margin-top: 2px; }

    /* ── POPUP ── */
    .popup {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        justify-content: center;
        align-items: center;
        z-index: 100;
    }

    .popup-content {
        background: var(--panel-bg);
        border: 2px solid var(--border);
        padding: 24px;
        width: 320px;
    }

    .popup-content h3 {
        font-size: 0.95rem;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
    }

    .popup-content p {
        font-size: 0.88rem;
        margin-bottom: 16px;
        color: #333;
    }

    /* ── TOAST ── */
    .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--black);
        color: white;
        padding: 10px 18px;
        font-size: 0.83rem;
        font-family: 'IBM Plex Mono', monospace;
        border-left: 4px solid var(--gold);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo-area">
        <svg class="umbc-shield" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <path d="M26 2 L50 10 L50 32 C50 44 38 50 26 52 C14 50 2 44 2 32 L2 10 Z" fill="#f0a500" stroke="#111" stroke-width="1.5"/>
            <path d="M26 6 L46 13 L46 31 C46 41 36 47 26 49 C16 47 6 41 6 31 L6 13 Z" fill="white"/>
            <rect x="6" y="6" width="20" height="22" fill="#c8102e" rx="0"/>
            <rect x="26" y="28" width="20" height="20" fill="#c8102e" rx="0"/>
            <text x="14" y="21" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="serif">M</text>
            <text x="36" y="42" font-size="11" font-weight="bold" fill="white" text-anchor="middle" font-family="serif">BC</text>
        </svg>
        <span class="umbc-text">UMBC</span>
    </div>
    <span class="header-title">Vending Inventory System</span>
</header>

<!-- MAIN BODY -->
<div class="app-body">

    <!-- ── LEFT SIDEBAR ── -->
    <aside class="sidebar">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchSidebarTab('dashboard', this)">Dashboard</button>
            <button class="nav-tab" onclick="switchSidebarTab('admin', this)">Admin Panel</button>
        </div>

        <!-- Dashboard Tab -->
        <div class="sidebar-content" id="sidebar-dashboard">
            <p style="font-size:0.8rem;color:#555;padding:4px 0 10px;">Overview and quick stats.</p>
            <div class="stat-card">
                <span>Total Slots</span>
                <span class="stat-value" id="sb-total">24</span>
            </div>
            <div class="stat-card healthy">
                <span>Healthy</span>
                <span class="stat-value" id="sb-healthy">—</span>
            </div>
            <div class="stat-card warning">
                <span>Low / Expiring</span>
                <span class="stat-value" id="sb-warning">—</span>
            </div>
            <div class="stat-card critical">
                <span>Critical / Out</span>
                <span class="stat-value" id="sb-critical">—</span>
            </div>
        </div>

        <!-- Admin Tab -->
        <div class="sidebar-content" id="sidebar-admin" style="display:none;">

            <!-- Manual Restock -->
            <div class="panel-box">
                <div class="panel-box-header" onclick="togglePanel('restock-body', this)">
                    + Manual Restock
                    <span class="toggle-btn">▸</span>
                </div>
                <div class="panel-box-body" id="restock-body">
                    <div class="form-row">
                        <label>Slot ID</label>
                        <select id="restock-slot">
                            <option value="">– Select Slot –</option>
                        </select>
                    </div>
                    <div class="field-error" id="slot-error">Please select a slot.</div>
                    <div class="form-row">
                        <label>Qty Added</label>
                        <input type="number" id="restock-qty" placeholder="e.g. 5" min="1" max="20">
                    </div>
                    <div class="field-error" id="qty-error">Quantity is required.</div>
                    <div class="form-row">
                        <label>Exp Date</label>
                        <input type="date" id="restock-date">
                    </div>
                    <div class="field-error" id="date-error">Expiration date is required.</div>
                    <div class="btn-row">
                        <button class="btn primary" onclick="doRestock()">Restock</button>
                        <button class="btn" onclick="clearRestock()">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Upload Inventory CSV -->
            <div class="panel-box">
                <div class="panel-box-header" onclick="togglePanel('inv-body', this)">
                    Upload New Inventory CSV
                    <span class="toggle-btn">▸</span>
                </div>
                <div class="panel-box-body" id="inv-body">
                    <div style="font-size:0.73rem;color:#444;margin-bottom:8px;line-height:1.4;">
                        <!-- Required columns:<br>
                        <code style="font-size:0.7rem;">slot_id, item_name, price, stock, expiration_date</code> -->
                    </div>
                    <div class="form-row">
                        <input type="file" accept=".csv" id="inv-file" style="font-size:0.75rem;">
                    </div>
                    <div class="csv-feedback" id="inv-feedback"></div>
                    <div class="btn-row">
                        <button class="btn primary" onclick="processInventoryCSV()">Upload &amp; Process</button>
                        <button class="btn" onclick="clearInvUpload()">Clear</button>
                    </div>
                    <hr style="border:none;border-top:1px solid var(--border);margin:10px 0;">
                    <button class="btn primary" id="update-inventory-btn" onclick="applyInventoryUpdate()" disabled
                        style="width:100%;opacity:0.4;cursor:not-allowed;">
                        🔄 Update Inventory
                    </button>
                </div>
            </div>

            <!-- Upload Transaction CSV -->
            <div class="panel-box">
                <div class="panel-box-header" onclick="togglePanel('txn-body', this)">
                    Upload Transaction CSV
                    <span class="toggle-btn">▸</span>
                </div>
                <div class="panel-box-body" id="txn-body">
                    <div style="font-size:0.73rem;color:#444;margin-bottom:8px;line-height:1.4;">
                        <!-- Required columns:<br>
                        <code style="font-size:0.7rem;">slot_id, item_name, price, quantity, date</code> -->
                    </div>
                    <div class="form-row">
                        <input type="file" accept=".csv" id="txn-file" style="font-size:0.75rem;">
                    </div>
                    <div class="csv-feedback" id="txn-feedback"></div>
                    <div class="btn-row">
                        <button class="btn primary" onclick="processTransactionCSV()">Upload &amp; Process</button>
                        <button class="btn" onclick="clearTxnUpload()">Clear</button>
                    </div>
                    <!-- <hr style="border:none;border-top:1px solid var(--border);margin:10px 0;">
                    <button class="btn primary" id="generate-report-btn" onclick="generateSalesReport()" disabled
                        style="width:100%;opacity:0.4;cursor:not-allowed;">
                        📊 Generate Sales Report
                    </button> -->
                </div>
            </div>

            <!-- Below the three panel-box divs, before sidebar-footer -->
            <hr style="border:none;border-top:1px solid var(--border);margin:10px 0;">
            <button class="btn primary" id="generate-report-btn" onclick="generateSalesReport()" disabled
                style="width:100%;opacity:0.4;cursor:not-allowed;margin-bottom:8px;">
                📊 Generate Sales Report
            </button>
        </div>

        <div class="sidebar-footer">
            <button class="btn" onclick="renderMachine(); updateStats();">Reload</button>
            <button class="btn" onclick="showToast('Help: hover slots to see details, click to purchase.')">Help</button>
        </div>
    </aside>

    <!-- ── RIGHT: MACHINE ── -->
    <section class="machine-panel">
        <div class="machine-panel-header">UMBC Vending Machine</div>
        <div class="machine-grid" id="machine"></div>
    </section>

</div>

<!-- PURCHASE POPUP -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h3>Confirm Purchase</h3>
        <p id="popup-text"></p>
        <div class="btn-row">
            <button class="btn primary" onclick="confirmPurchase()">Confirm</button>
            <button class="btn" onclick="closePopup()">Cancel</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

const items = [
    ["Chips",1.50],["Soda",2.00],["Candy Bar",1.25],["Water",1.00],
    ["Cookies",1.75],["Juice",2.25],["Gum",0.75],["Crackers",1.50],
    ["Granola Bar",1.25],["Iced Tea",2.00],["Trail Mix",1.75],["Energy Drink",3.00],
    ["Pretzels",1.50],["Sparkling Water",2.25],["Chocolate",1.50],["Nuts",2.00],
    ["Popcorn",1.75],["Lemonade",2.00],["Protein Bar",2.50],["Coffee Can",2.75],
    ["Candy",1.00],["Milk",2.25],["Smoothie",3.50],["Water Bottle",1.50]
];

const rows = ["A","B","C","D","E","F"];
let inventory = Array.from({length:24}, () => Math.floor(Math.random()*11));
let daysUntilExpiration = Array.from({length:24}, () => Math.floor(Math.random()*13)-2);
let selectedIndex = null;
let txnData = null;
let invData = null;
let transactionLog = [];
let patronCounter = 100001;


function slotLabel(i) { 
    return rows[Math.floor(i/4)] + ((i % 4) + 1); 
}

function getColorClass(count, days) {
    if (days <= 0 || count === 0) return "disabled";
    if (count <= 2 || days <= 2) return "red";
    if (count <= 5 || days <= 5) return "yellow";
    return "green";
}

function renderMachine() {
    const machine = document.getElementById("machine");
    machine.innerHTML = "";
    for (let i = 0; i < 24; i++) {
        const [name, price] = items[i];
        const count = inventory[i];
        const days = daysUntilExpiration[i];
        const expired = days <= 0;
        const colorClass = getColorClass(count, days);
        const slot = document.createElement("div");
        slot.className = `slot ${colorClass}`;
        slot.innerHTML = `
            <div class="slot-id">${slotLabel(i)}</div>
            <div class="slot-name">${name}</div>
            <div class="slot-price">$${price.toFixed(2)}</div>
            <div class="slot-stock">Stock: ${count}</div>
            <div class="slot-exp">${expired ? "⚠ Expired" : `Exp: ${days}d`}</div>
        `;
        if (count > 0 && !expired) slot.onclick = () => openPopup(i, slotLabel(i), name, price);
        machine.appendChild(slot);
    }
    updateStats();
}

function updateStats() {
    let healthy = 0, warning = 0, critical = 0;
    for (let i = 0; i < 24; i++) {
        const c = inventory[i], d = daysUntilExpiration[i];
        if (d <= 0 || c === 0) critical++;
        else if (c <= 2 || d <= 2) critical++;
        else if (c <= 5 || d <= 5) warning++;
        else healthy++;
    }
    document.getElementById("sb-healthy").textContent = healthy;
    document.getElementById("sb-warning").textContent = warning;
    document.getElementById("sb-critical").textContent = critical;

    const sel = document.getElementById("restock-slot");
    sel.innerHTML = '<option value="">– Select Slot –</option>';
    for (let i = 0; i < 24; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${slotLabel(i)} – ${items[i][0]}`;
        sel.appendChild(opt);
    }
}

function openPopup(index, slotId, name, price) {
    selectedIndex = index;
    document.getElementById("popup-text").textContent =
        `Purchase ${name} (Slot ${slotId}) for $${price.toFixed(2)}?`;
    document.getElementById("popup").style.display = "flex";
}

function closePopup() { document.getElementById("popup").style.display = "none"; }

function confirmPurchase() {
    if (selectedIndex !== null && inventory[selectedIndex] > 0) {
        inventory[selectedIndex]--;
        const [name, price] = items[selectedIndex];
        logTransaction(name, price);
        showToast(`✓ ${name} dispensed!`);
    }
    closePopup();
    renderMachine();
}

function switchSidebarTab(tab, btn) {
    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("sidebar-dashboard").style.display = tab === "dashboard" ? "block" : "none";
    document.getElementById("sidebar-admin").style.display = tab === "admin" ? "block" : "none";
}

function togglePanel(bodyId, header) {
    const body = document.getElementById(bodyId);
    const isOpen = body.classList.toggle("open");
    header.querySelector(".toggle-btn").textContent = isOpen ? "▾" : "▸";
}

function setUpdateBtnEnabled(enabled) {
    const btn = document.getElementById("update-inventory-btn");
    btn.disabled = !enabled;
    btn.style.opacity = enabled ? "1" : "0.4";
    btn.style.cursor = enabled ? "pointer" : "not-allowed";
}

// ── Restock ──
function doRestock() {
    const idx = document.getElementById("restock-slot").value;
    const qty = parseInt(document.getElementById("restock-qty").value);
    const dateVal = document.getElementById("restock-date").value;

    document.getElementById("slot-error").classList.remove("visible");
    document.getElementById("qty-error").classList.remove("visible");
    document.getElementById("date-error").classList.remove("visible");

    let hasError = false;

    if (idx === "") {
        document.getElementById("slot-error").classList.add("visible");
        hasError = true;
    }

    if (isNaN(qty) || qty < 1) {
        document.getElementById("qty-error").textContent = "Quantity is required.";
        document.getElementById("qty-error").classList.add("visible");
        hasError = true;
    } else if (idx !== "") {
        const remaining = inventory[parseInt(idx)];
        const maxQty = 10 - remaining;
        if (qty > maxQty) {
            document.getElementById("qty-error").textContent = `Quantity cannot exceed ${maxQty}.`;
            document.getElementById("qty-error").classList.add("visible");
            hasError = true;
        }
    }

    if (!dateVal) {
        document.getElementById("date-error").classList.add("visible");
        hasError = true;
    }

    if (hasError) return;

    inventory[parseInt(idx)] = Math.min(10, inventory[parseInt(idx)] + qty);
    const today = new Date();
    const exp = new Date(dateVal);
    const diff = Math.round((exp - today) / (1000*60*60*24));
    daysUntilExpiration[parseInt(idx)] = diff;

    showToast(`✓ ${items[parseInt(idx)][0]} restocked (+${qty})`);
    clearRestock();
    renderMachine();
}

function clearRestock() {
    document.getElementById("restock-slot").value = "";
    document.getElementById("restock-qty").value = "";
    document.getElementById("restock-date").value = "";
    document.getElementById("slot-error").classList.remove("visible");
    document.getElementById("qty-error").classList.remove("visible");
    document.getElementById("date-error").classList.remove("visible");
}

// ── Transaction CSV Processing ──
function clearTxnUpload() {
    document.getElementById("txn-file").value = "";
    const fb = document.getElementById("txn-feedback");
    fb.className = "csv-feedback";
    fb.textContent = "";
    // Note: do NOT clear transactionLog here — 
    // only the file input is cleared, uploaded rows remain in the log
}

function processTransactionCSV() {
    const file = document.getElementById("txn-file").files[0];
    const fb = document.getElementById("txn-feedback");
    fb.className = "csv-feedback";
    fb.textContent = "";

    if (!file) {
        fb.textContent = "Please select a CSV file first.";
        fb.className = "csv-feedback error visible";
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const result = parseCBORDCSV(e.target.result);
        if (result.error) {
            fb.textContent = result.error;
            fb.className = "csv-feedback error visible";
            return;
        }
        // Append to existing transaction log
        transactionLog = transactionLog.concat(result.rows);
        fb.textContent = `✓ ${result.rows.length} transaction(s) added. Total: ${transactionLog.length}.`;
        fb.className = "csv-feedback success visible";
        setReportBtnEnabled(transactionLog.length > 0);
    };
    reader.readAsText(file);
}

function parseCBORDCSV(text) {
    const lines = text.trim().split("\n").map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2) return { error: "CSV must have a header row and at least one data row." };

    const header = lines[0].split(",").map(h => h.trim().toLowerCase());
    const required = ["transaction date", "tran amt"];
    for (const col of required) {
        if (!header.includes(col)) return { error: `Missing required column: "${col}".` };
    }

    const idx = col => header.indexOf(col);
    const rows = [];

    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",").map(c => c.trim());
        const price = parseFloat(cols[idx("tran amt")]);
        if (isNaN(price)) continue;

        // Only include rows that match a known item price
        const matchedItem = items.find(item => Math.abs(item[1] - price) < 0.001);
        if (!matchedItem) continue;

        rows.push({
            "Transaction Date": cols[idx("transaction date")] || "",
            "Location":         cols[header.indexOf("location")] || "1499 Lib_Sup",
            "SV&C Plan":        cols[header.indexOf("sv&c plan")] || "",
            "Primary Key":      cols[header.indexOf("primary key")] || "",
            "Patron Name":      cols[header.indexOf("patron name")] || "",
            "Tran Amt":         price.toFixed(2),
            "Amt Remain":       cols[header.indexOf("amt remain")] || "0.00",
            "Tax":              cols[header.indexOf("tax")] || "0.00",
            "Period":           cols[header.indexOf("period")] || "",
            "Stat":             "C"
        });
    }

    if (rows.length === 0) return { error: "No transactions matched any known item price." };
    return { rows };
}

function setReportBtnEnabled(enabled) {
    const btn = document.getElementById("generate-report-btn");
    btn.disabled = !enabled;
    btn.style.opacity = enabled ? "1" : "0.4";
    btn.style.cursor = enabled ? "pointer" : "not-allowed";
}

function parseTransactionCSV(text) {
    const lines = text.trim().split("\n").map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2) return { error: "CSV must have a header row and at least one data row." };

    const header = lines[0].split(",").map(h => h.trim().toLowerCase());
    const required = ["slot_id", "item_name", "price", "quantity", "date"];
    for (const col of required) {
        if (!header.includes(col)) return { error: `Missing required column: "${col}".` };
    }

    const idx = col => header.indexOf(col);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",").map(c => c.trim());
        const price = parseFloat(cols[idx("price")]);
        const quantity = parseInt(cols[idx("quantity")]);
        if (isNaN(price) || isNaN(quantity)) continue;
        rows.push({
            slot_id:   cols[idx("slot_id")],
            item_name: cols[idx("item_name")],
            price,
            quantity,
            date:      cols[idx("date")]
        });
    }

    if (rows.length === 0) return { error: "No valid data rows found in CSV." };
    return { rows };
}

function parseInventoryCSV(text) {
    const lines = text.trim().split("\n").map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2) return { error: "CSV must have a header row and at least one data row." };

    const header = lines[0].split(",").map(h => h.trim().toLowerCase());

    // Required columns
    const required = ["row", "product", "vending price"];
    for (const col of required) {
        if (!header.includes(col)) return { error: `Missing required column: "${col}".` };
    }

    // Check for optional columns
    const hasStock      = header.includes("stock");
    const hasExpiration = header.includes("expiration_date");

    const idx = col => header.indexOf(col);
    const rows = [];

    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",").map(c => c.trim());
        const price = parseFloat(cols[idx("vending price")]);
        const stock = hasStock ? parseInt(cols[idx("stock")]) : null;

        if (isNaN(price)) continue;
        if (hasStock && isNaN(stock)) continue;

        rows.push({
            slot_id:         cols[idx("row")],
            item_name:       cols[idx("product")],
            price,
            stock:           hasStock ? stock : null,
            expiration_date: hasExpiration ? cols[idx("expiration_date")] : null
        });
    }

    if (rows.length === 0) return { error: "No valid data rows found in CSV." };
    return { rows };
}

function processInventoryCSV() {
    const file = document.getElementById("inv-file").files[0];
    const fb = document.getElementById("inv-feedback");
    fb.className = "csv-feedback";
    fb.textContent = "";

    if (!file) {
        fb.textContent = "Please select a CSV file first.";
        fb.className = "csv-feedback error visible";
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const result = parseInventoryCSV(e.target.result);
        if (result.error) {
            fb.textContent = result.error;
            fb.className = "csv-feedback error visible";
            invData = null;
            setUpdateBtnEnabled(false);
            return;
        }
        invData = { rows: result.rows, filename: file.name };
        fb.textContent = `✓ ${result.rows.length} slot(s) ready to update.`;
        fb.className = "csv-feedback success visible";
        setUpdateBtnEnabled(true);
    };
    reader.readAsText(file);
}

function applyInventoryUpdate() {
    if (!invData) return;

    for (const row of invData.rows) {
        const slotIndex = (() => {
            for (let i = 0; i < 24; i++) {
                if (slotLabel(i) === row.slot_id) return i;
            }
            return -1;
        })();

        if (slotIndex === -1) continue;

        // Update item name and price
        items[slotIndex][0] = row.item_name;
        items[slotIndex][1] = row.price;

        // Only update stock if provided
        if (row.stock !== null) {
            inventory[slotIndex] = Math.min(10, row.stock);
        }

        // Only update expiration if provided
        if (row.expiration_date !== null) {
            const today = new Date();
            const exp = new Date(row.expiration_date);
            const diff = Math.round((exp - today) / (1000*60*60*24));
            daysUntilExpiration[slotIndex] = isNaN(diff) ? 0 : diff;
        }
    }

    showToast(`✓ Inventory updated from ${invData.filename}`);
    clearInvUpload();
    renderMachine();
}

function clearInvUpload() {
    document.getElementById("inv-file").value = "";
    const fb = document.getElementById("inv-feedback");
    fb.className = "csv-feedback";
    fb.textContent = "";
    invData = null;
    setUpdateBtnEnabled(false);
}

// -- Generate Sales Report --
function generateSalesReport() {
    if (!transactionLog || transactionLog.length === 0) return;

    // Convert transactionLog to the format openSalesReport expects
    const rows = transactionLog.map(t => {
        const price = parseFloat(t["Tran Amt"]);
        const matchedItem = items.find(item => Math.abs(item[1] - price) < 0.001);
        return {
            item_name: matchedItem ? matchedItem[0] : "Unknown",
            price:     price,
            quantity:  1,
            date:      t["Transaction Date"].split(" ")[0] || ""
        };
    }).filter(r => r.item_name !== "Unknown");

    openSalesReport(rows, "transaction_log");
}
